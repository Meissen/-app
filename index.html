  <script>
    /**
     * =========================================================================
     * 0. 企業級安全防禦模組 (Security Guard & Sanitizer)
     * =========================================================================
     */
    const Security = {
      // 嚴格轉義 HTML 實體，防禦所有動態文字輸出型 XSS
      escape(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      },

      // 引入 DOMPurify 進行專業級 AST 白名單過濾，防禦 Mutation XSS
      sanitizeRuby(htmlStr) {
        if (!htmlStr) return '';
        if (typeof DOMPurify !== 'undefined' && DOMPurify.sanitize) {
          return DOMPurify.sanitize(htmlStr, {
            ALLOWED_TAGS: ['ruby', 'rt', 'rp'],
            ALLOWED_ATTR: []
          });
        }
        // 離線安全字串轉義，保留合法 ruby/rt 標籤
        return String(htmlStr)
          .replace(/<(?!\/?(ruby|rt|rp)\b)[^>]*>/gi, '')
          .replace(/<(ruby|rt|rp)\s+[^>]*>/gi, '<$1>');
      },

      safeJsonParse(raw, fallback) {
        try {
          return raw ? JSON.parse(raw) : fallback;
        } catch(e) {
          console.warn('[Security] 本機快取格式異常，已安全重置', e);
          return fallback;
        }
      }
    };

    /**
     * =========================================================================
     * 0.1 日語平假名振假名智慧排版引擎 (Kana & Ruby Alignment Engine)
     * 將讀音自動轉為道地平假名，並與漢字完美對齊標註，徹底避免羅馬字充當假名
     * =========================================================================
     */
    const KanaHelper = {
      romajiMap: [
        ['tchi', 'っち'], ['ttsu', 'っつ'],
        ['kya', 'きゃ'], ['kyu', 'きゅ'], ['kyo', 'きょ'],
        ['sha', 'しゃ'], ['shu', 'しゅ'], ['sho', 'しょ'],
        ['cha', 'ちゃ'], ['chu', 'ちゅ'], ['cho', 'ちょ'],
        ['nya', 'にゃ'], ['nyu', 'にゅ'], ['nyo', 'にょ'],
        ['hya', 'ひゃ'], ['hyu', 'ひゅ'], ['hyo', 'ひょ'],
        ['mya', 'みゃ'], ['myu', 'みゅ'], ['myo', 'みょ'],
        ['rya', 'りゃ'], ['ryu', 'りゅ'], ['ryo', 'りょ'],
        ['gya', 'ぎゃ'], ['gyu', 'ぎゅ'], ['gyo', 'ぎょ'],
        ['bya', 'びゃ'], ['byu', 'びゅ'], ['byo', 'びょ'],
        ['pya', 'ぴゃ'], ['pyu', 'ぴゅ'], ['pyo', 'ぴょ'],
        ['tsu', 'つ'], ['shi', 'し'], ['chi', 'ち'],
        ['ka', 'か'], ['ki', 'き'], ['ku', 'く'], ['ke', 'け'], ['ko', 'こ'],
        ['sa', 'さ'], ['si', 'し'], ['su', 'す'], ['se', 'せ'], ['so', 'そ'],
        ['ta', 'た'], ['ti', 'ち'], ['tu', 'つ'], ['te', 'て'], ['to', 'と'],
        ['na', 'な'], ['ni', 'に'], ['nu', 'ぬ'], ['ne', 'ね'], ['no', 'の'],
        ['ha', 'は'], ['hi', 'ひ'], ['fu', 'ふ'], ['he', 'へ'], ['ho', 'ほ'],
        ['ma', 'ま'], ['mi', 'み'], ['mu', 'む'], ['me', 'め'], ['mo', 'も'],
        ['ya', 'や'], ['yu', 'ゆ'], ['yo', 'よ'],
        ['ra', 'ら'], ['ri', 'り'], ['ru', 'る'], ['re', 'れ'], ['ro', 'ろ'],
        ['wa', 'わ'], ['wo', 'を'],
        ['ga', 'が'], ['gi', 'ぎ'], ['gu', 'ぐ'], ['ge', 'げ'], ['go', 'ご'],
        ['za', 'ざ'], ['ji', 'じ'], ['zu', 'ず'], ['ze', 'ぜ'], ['zo', 'ぞ'],
        ['da', 'だ'], ['di', 'ぢ'], ['du', 'づ'], ['de', 'で'], ['do', 'ど'],
        ['ba', 'ば'], ['bi', 'び'], ['bu', 'ぶ'], ['be', 'べ'], ['bo', 'ぼ'],
        ['pa', 'ぱ'], ['pi', 'ぴ'], ['pu', 'ぷ'], ['pe', 'ぺ'], ['po', 'ぽ'],
        ['ja', 'じゃ'], ['ju', 'じゅ'], ['jo', 'じょ'],
        ['a', 'あ'], ['i', 'い'], ['u', 'う'], ['e', 'え'], ['o', 'お'],
        ['n', 'ん']
      ],

      toHiragana(romaji) {
        if (!romaji) return '';
        // 若本身已包含假名，直接回傳
        if (/[\u3040-\u309f\u30a0-\u30ff]/.test(romaji)) return romaji;
        let text = romaji.toLowerCase().trim();
        let res = '';
        let i = 0;
        while (i < text.length) {
          if (i + 1 < text.length && text[i] === text[i+1] && 'kstpcf'.includes(text[i])) {
            res += 'っ';
            i += 1;
            continue;
          }
          let matched = false;
          for (const [rom, hir] of this.romajiMap) {
            if (text.startsWith(rom, i)) {
              res += hir;
              i += rom.length;
              matched = true;
              break;
            }
          }
          if (!matched) {
            res += text[i];
            i += 1;
          }
        }
        return res;
      },

      buildRuby(kanjiWord, phoneticStr) {
        if (!kanjiWord) return '';
        if (kanjiWord.includes('<ruby>')) return kanjiWord;
        
        const hasKanji = /[\u4e00-\u9fa5]/.test(kanjiWord);
        if (!hasKanji) return kanjiWord;

        if (!phoneticStr) return kanjiWord;
        const cleanPhonetic = phoneticStr.split('(')[0].replace(/原形.*?/g, '').replace(/常體.*?/g, '').trim();
        const hiragana = this.toHiragana(cleanPhonetic).replace(/\s+/g, '');

        if (!hiragana) return kanjiWord;

        const kw = kanjiWord.replace(/\s+/g, '');
        let suffixLen = 0;
        while (suffixLen < kw.length && 
               suffixLen < hiragana.length && 
               kw[kw.length - 1 - suffixLen] === hiragana[hiragana.length - 1 - suffixLen] &&
               !/[\u4e00-\u9fa5]/.test(kw[kw.length - 1 - suffixLen])) {
          suffixLen++;
        }

        let prefixLen = 0;
        while (prefixLen < (kw.length - suffixLen) && 
               prefixLen < (hiragana.length - suffixLen) && 
               kw[prefixLen] === hiragana[prefixLen] &&
               !/[\u4e00-\u9fa5]/.test(kw[prefixLen])) {
          prefixLen++;
        }

        const prefix = kw.slice(0, prefixLen);
        const suffix = suffixLen > 0 ? kw.slice(kw.length - suffixLen) : '';
        const kanjiPart = kw.slice(prefixLen, suffixLen > 0 ? kw.length - suffixLen : kw.length);
        const rtPart = hiragana.slice(prefixLen, suffixLen > 0 ? hiragana.length - suffixLen : hiragana.length);

        if (kanjiPart && rtPart) {
          return `${prefix}<ruby>${kanjiPart}<rt>${rtPart}</rt></ruby>${suffix}`;
        }
        return `<ruby>${kw}<rt>${hiragana}</rt></ruby>`;
      }
    };


    /**
     * 1. 語言設定
     */
    const PRESET_LANGUAGES = [

      { code: 'es', name: 'Español (西文)', ttsLang: 'es-ES', flag: '🇪🇸', phoneticLabel: '音節 / 重音標註', placeholder: '西文單字/例句...' },
      { code: 'fr', name: 'Français (法文)', ttsLang: 'fr-FR', flag: '🇫🇷', phoneticLabel: '國際音標 (IPA)', placeholder: '法文單字/例句...' },
      { code: 'de', name: 'Deutsch (德文)', ttsLang: 'de-DE', flag: '🇩🇪', phoneticLabel: '發音 / 音標', placeholder: '德文單字/例句...' },
      { code: 'ko', name: '한국어 (韓文)', ttsLang: 'ko-KR', flag: '🇰🇷', phoneticLabel: '羅馬拼音', placeholder: '韓文單字/例句...' }

    const INITIAL_VOCABULARY = [

    const INITIAL_SENTENCES = [
      {
        id: "s_001",
        category: "日常問候",
        prompt_zh: "{greeting}，很高興見到你。",
        en_target: "{greeting}, nice to meet you.",
        ja_target: "{greeting}、はじめまして。",
        ja_ruby: "{greeting}、はじめまして。",
        ja_plain: "{greeting}、よろしくね。",
        ja_plain_ruby: "{greeting}、よろしくね。",
        es_target: "{greeting}, mucho gusto.",
        hints: "[問候語] [很高興見到你]",
        ja_grammar: "「はじめまして」為初次見面標準禮貌用語；朋友口語常簡化為「よろしくね」。",
        es_grammar: "Mucho gusto 意為「很高興認識你」，為固定短語，性數不隨性別改變。",
        variants: [
          { zh: "早安", en: "Good morning", ja: "おはようございます", ja_plain: "おはよう", es: "Buenos días" },
          { zh: "午安", en: "Good afternoon", ja: "こんにちは", ja_plain: "こんにちは", es: "Buenas tardes" },
          { zh: "晚安", en: "Good evening", ja: "こんばんは", ja_plain: "こんばんは", es: "Buenas noches" }
        ]

        en_target: "{item}, please, thank you.",
        ja_target: "{item}をお願いします、ありがとうございます。",

        ja_grammar: "「〜をお願いします」為禮貌請求句型；朋友日常口語常用「〜ちょうだい」或「〜頼む」。",
        es_grammar: "Por favor (請) 放句首或句末皆可；點餐時名詞常省略或搭配不定冠詞。",
        variants: [
          { zh: "水", en: "Water", ja: "お水", ja_plain: "水", es: "Agua" },
          { zh: "茶", en: "Tea", ja: "お茶", ja_plain: "お茶", es: "Té" },
          { zh: "咖啡", en: "Coffee", ja: "コーヒー", ja_plain: "コーヒー", es: "Café" }
        ]
      }
    ];

    /**
     * 2. SM-2 間隔重複演算法
     */
    const SM2 = {
      DEFAULT_EF: 2.5,
      MIN_EF: 1.3,
      calculate(itemState = {}, quality) {
        let repetitions = itemState.repetitions || 0;
        let interval = itemState.interval || 0;
        let ef = itemState.ef || this.DEFAULT_EF;

        if (quality >= 3) {
          if (repetitions === 0) interval = 1;
          else if (repetitions === 1) interval = 6;
          else interval = Math.round(interval * ef);
          repetitions += 1;
        } else {
          repetitions = 0;
          interval = 1;
        }

        ef = ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
        if (ef < this.MIN_EF) ef = this.MIN_EF;

        const nextDate = new Date();
        nextDate.setDate(nextDate.getDate() + interval);

        return {
          repetitions,
          interval,
          ef: parseFloat(ef.toFixed(2)),
          nextReviewDate: nextDate.toISOString(),
          lastReviewed: new Date().toISOString(),
          lastQuality: quality
        };
      }
    };

    /**
     * 3. 本地儲存層 (支援安全 Session 暫存與 GAS Token 驗證)
     */
    const Storage = {
      KEY_VOCAB: 'polyglot_vocab_data_v4',
      KEY_SENTENCES: 'polyglot_sentences_v2',
      KEY_SRS: 'polyglot_srs_records_v3',
      KEY_GAS_URL: 'polyglot_gas_url',
      KEY_GAS_TOKEN: 'polyglot_gas_token',
      KEY_GEMINI_KEY: 'polyglot_gemini_key',
      KEY_KEY_STORAGE_MODE: 'polyglot_key_storage_mode',
      KEY_CATEGORIES: 'polyglot_categories',
      KEY_TEST_MODE: 'polyglot_test_mode',
      KEY_TEST_IDS: 'polyglot_test_word_ids',
      KEY_VOLUMES: 'polyglot_tts_volumes',
      KEY_USER_LANGS: 'polyglot_user_languages',
      KEY_ACTIVE_LANGS: 'polyglot_active_languages',
      KEY_AI_ENABLED: 'polyglot_ai_autofill_enabled',
      KEY_SMART_GUIDANCE: 'polyglot_smart_guidance_enabled',
      KEY_SHOW_FURIGANA: 'polyglot_show_furigana',
      KEY_SHOW_ES_GENDER: 'polyglot_show_es_gender',

      srsPendingCount: 0,

      getKeyStorageMode() {
        return localStorage.getItem(this.KEY_KEY_STORAGE_MODE) || 'local';
      },
      setKeyStorageMode(mode) {
        localStorage.setItem(this.KEY_KEY_STORAGE_MODE, mode);
      },
      getGeminiKey() {
        const mode = this.getKeyStorageMode();
        if (mode === 'session') {
          return sessionStorage.getItem(this.KEY_GEMINI_KEY) || '';
        }
        return localStorage.getItem(this.KEY_GEMINI_KEY) || '';
      },
      setGeminiKey(key) {
        const mode = this.getKeyStorageMode();
        if (mode === 'session') {
          sessionStorage.setItem(this.KEY_GEMINI_KEY, key.trim());
          localStorage.removeItem(this.KEY_GEMINI_KEY);
        } else {
          localStorage.setItem(this.KEY_GEMINI_KEY, key.trim());
          sessionStorage.removeItem(this.KEY_GEMINI_KEY);
        }
      },

      getGasToken() {
        return localStorage.getItem(this.KEY_GAS_TOKEN) || '';
      },
      setGasToken(token) {
        localStorage.setItem(this.KEY_GAS_TOKEN, token.trim());
      },

      isAiEnabled() {
        const val = localStorage.getItem(this.KEY_AI_ENABLED);
        return val === null ? true : val === 'true';
      },
      setAiEnabled(enabled) {
        localStorage.setItem(this.KEY_AI_ENABLED, enabled ? 'true' : 'false');
      },

      isSmartGuidanceEnabled() {
        const val = localStorage.getItem(this.KEY_SMART_GUIDANCE);
        return val === null ? true : val === 'true';
      },
      setSmartGuidanceEnabled(enabled) {
        localStorage.setItem(this.KEY_SMART_GUIDANCE, enabled ? 'true' : 'false');
      },

      isFuriganaEnabled() {
        const val = localStorage.getItem(this.KEY_SHOW_FURIGANA);
        return val === null ? true : val === 'true';
      },
      setFuriganaEnabled(enabled) {
        localStorage.setItem(this.KEY_SHOW_FURIGANA, enabled ? 'true' : 'false');
      },

      isEsGenderEnabled() {
        const val = localStorage.getItem(this.KEY_SHOW_ES_GENDER);
        return val === null ? true : val === 'true';
      },
      setEsGenderEnabled(enabled) {
        localStorage.setItem(this.KEY_SHOW_ES_GENDER, enabled ? 'true' : 'false');
      },

      getSentences() {
        return Security.safeJsonParse(localStorage.getItem(this.KEY_SENTENCES), INITIAL_SENTENCES);
      },
      setSentences(list) {
        localStorage.setItem(this.KEY_SENTENCES, JSON.stringify(list));
      },

      getUserLangs() {
        return Security.safeJsonParse(localStorage.getItem(this.KEY_USER_LANGS), PRESET_LANGUAGES.slice(0, 2));
      },
      addUserLang(langObj) {
        const list = this.getUserLangs();
        if (!list.some(l => l.code === langObj.code)) {
          list.push(langObj);
          localStorage.setItem(this.KEY_USER_LANGS, JSON.stringify(list));
          this.activateLang(langObj.code);
        }
      },
      removeUserLang(code) {
        let list = this.getUserLangs();
        if (list.length <= 1) return alert('至少需保留一種語言！');
        list = list.filter(l => l.code !== code);
        localStorage.setItem(this.KEY_USER_LANGS, JSON.stringify(list));
        let active = this.getActiveLangs().filter(c => c !== code);
        localStorage.setItem(this.KEY_ACTIVE_LANGS, JSON.stringify(active));
      },

      getActiveLangs() {
        return Security.safeJsonParse(localStorage.getItem(this.KEY_ACTIVE_LANGS), this.getUserLangs().map(l => l.code));
      },
      isLangActive(code) {
        return this.getActiveLangs().includes(code);
      },
      toggleLangActive(code) {
        let active = this.getActiveLangs();
        if (active.includes(code)) {
          if (active.length <= 1) return alert('至少需啟動一種語言！');
          active = active.filter(c => c !== code);
        } else {
          active.push(code);
        }
        localStorage.setItem(this.KEY_ACTIVE_LANGS, JSON.stringify(active));
      },
      activateLang(code) {
        const active = this.getActiveLangs();
        if (!active.includes(code)) {
          active.push(code);
          localStorage.setItem(this.KEY_ACTIVE_LANGS, JSON.stringify(active));
        }
      },

      getVocab() {
        return Security.safeJsonParse(localStorage.getItem(this.KEY_VOCAB), INITIAL_VOCABULARY);
      },
      setVocab(list) { localStorage.setItem(this.KEY_VOCAB, JSON.stringify(list)); },
      addWord(wordObj) {
        const vocab = this.getVocab();
        vocab.unshift(wordObj);
        this.setVocab(vocab);
        if (this.isTestMode()) {
          const testIds = this.getTestIds();
          testIds.push(wordObj.id);
          localStorage.setItem(this.KEY_TEST_IDS, JSON.stringify(testIds));
        }
      },

      isTestMode() { return localStorage.getItem(this.KEY_TEST_MODE) === 'true'; },
      setTestMode(val) {
        localStorage.setItem(this.KEY_TEST_MODE, val ? 'true' : 'false');
        this.updateTestBanner();
      },
      getTestIds() {
        return Security.safeJsonParse(localStorage.getItem(this.KEY_TEST_IDS), []);
      },
      updateTestBanner() {
        const banner = document.getElementById('testBanner');
        if (banner) {
          banner.className = this.isTestMode() ? 'bg-amber-500 text-slate-950 font-bold px-4 py-1.5 text-xs text-center flex items-center justify-between z-30' : 'hidden';
        }
      },
      async clearTestModeData() {
        if (!confirm('確定要結束測試模式，並將測試期間的所有單字自本地與 Google 試算表刪除嗎？')) return;
        const testIds = this.getTestIds();
        let vocab = this.getVocab().filter(w => !testIds.includes(w.id));
        this.setVocab(vocab);
        localStorage.removeItem(this.KEY_TEST_IDS);
        this.setTestMode(false);

        const gasUrl = this.getGasUrl();
        if (gasUrl && testIds.length > 0) {
          try {
            await fetch(gasUrl, {
              method: 'POST',
              body: JSON.stringify({ action: 'deleteTestWords', testIds: testIds, token: this.getGasToken() })
            });
            alert('已成功清除測試單字！');
          } catch(e) {
            alert('本地已清除，但雲端刪除失敗。');
          }
        }
        router.updateStats();
        router.refresh();
      },

      getVolume(code) {
        const map = Security.safeJsonParse(localStorage.getItem(this.KEY_VOLUMES), {});
        return map[code] !== undefined ? map[code] : 1;
      },
      setVolume(code, val) {
        const map = Security.safeJsonParse(localStorage.getItem(this.KEY_VOLUMES), {});
        map[code] = parseFloat(val);
        localStorage.setItem(this.KEY_VOLUMES, JSON.stringify(map));
      },

      getCategories() {
        return Security.safeJsonParse(localStorage.getItem(this.KEY_CATEGORIES), ["日常問候", "餐飲點餐", "社交場所", "職場商業", "旅遊會話"]);
      },
      addCategory(cat) {
        if (!cat) return;
        const cats = this.getCategories();
        if (!cats.includes(cat)) {
          cats.push(cat);
          localStorage.setItem(this.KEY_CATEGORIES, JSON.stringify(cats));
        }
      },

      getSrsRecords() {
        return Security.safeJsonParse(localStorage.getItem(this.KEY_SRS), {});
      },
      getLangSrs(wordId, langCode) {
        return this.getSrsRecords()[`${wordId}_${langCode}`] || null;
      },
      saveLangSrs(wordId, langCode, quality) {
        const records = this.getSrsRecords();
        const key = `${wordId}_${langCode}`;
        records[key] = SM2.calculate(records[key], quality);
        localStorage.setItem(this.KEY_SRS, JSON.stringify(records));

        this.srsPendingCount++;
        if (this.srsPendingCount >= 5) {
          this.syncSrsToCloudSilently();
          this.srsPendingCount = 0;
        }
        return records[key];
      },
      async syncSrsToCloudSilently() {
        const gasUrl = this.getGasUrl();
        if (!gasUrl) return;
        try {
          fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'syncSrs', srsRecords: this.getSrsRecords(), token: this.getGasToken() })
          });
        } catch(e) {}
      },

      getGasUrl() { return localStorage.getItem(this.KEY_GAS_URL) || ''; },
      setGasUrl(url) { localStorage.setItem(this.KEY_GAS_URL, url.trim()); }
    };

    /**
     * 4. 語音朗讀模組
     */
    const TTS = {
      speak(text, langCode) {
        if (!('speechSynthesis' in window) || !text) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        if (langCode === 'en') {
          utterance.lang = 'en-US';
        } else {
          const userLangs = Storage.getUserLangs();
          const langMeta = userLangs.find(l => l.code === langCode);
          if (langMeta) utterance.lang = langMeta.ttsLang;
        }
        utterance.rate = 0.9;
        utterance.volume = Storage.getVolume(langCode);
        window.speechSynthesis.speak(utterance);
      }
    };

    /**
     * 5. Gemini AI 自動辨識模組
     */
    const AIHelper = {
      async fillMissingFields(existingData, targetLanguages) {
        const apiKey = Storage.getGeminiKey();
        if (!apiKey) throw new Error("請先在「設定」填入 Gemini API Key！");

        const langs = targetLanguages || Storage.getUserLangs();
        const existingCats = Storage.getCategories().join(', ');
        
        const langTargetsPrompt = langs.map(l => 
          `"${l.code}": { "translation": "${l.name}標準翻譯", "phonetic": "${l.phoneticLabel}", "ruby": "若是日文請提供包含漢字與振假名的HTML ruby格式(例如 <ruby>図<rt>と</rt>書<rt>しょ</rt>館<rt>かん</rt></ruby>)，其他語言可與translation相同" }`
        ).join(', ');

        const systemPrompt = `You are a professional polyglot lexicographer.
The user provides partial vocabulary in ANY language (English, Traditional Chinese, Japanese, Spanish, etc.).
Important Instructions:
1. TYPO CORRECTION: If the user made a typo/misspelling, automatically correct it to the canonical form.
2. PART OF SPEECH (pos): Deduce the primary part of speech in Traditional Chinese (e.g. "名詞", "動詞", "形容詞", "副詞", "感嘆詞", "慣用短語").
3. SPANISH ARTICLES: For Spanish nouns, ALWAYS include the definite article ('el' for masculine, 'la' for feminine, 'los'/'las' for plural).
4. JAPANESE BEGINNER-FRIENDLY FORMS: Provide the standard polite form (丁寧體) as translation, and if verb/adjective, mention plain dictionary form (朋友說法/原形) in phonetic.
5. JAPANESE FURIGANA: If Kanji exists, ALWAYS provide the "ruby" field with valid HTML <ruby> and <rt> tags.
6. Return ONLY valid JSON matching this schema:

Schema:
{
  "baseWord": "Corrected English word",
  "meaningZh": "繁體中文釋義",
  "category": "繁體中文主題分類 (choose from [${existingCats}] or suggest a new one)",
  "pos": "詞性 (如: 名詞/動詞/形容詞)",
  "targets": {
    ${langTargetsPrompt}
  }
}`;

        const requestBody = {
          contents: [{
            role: "user",
            parts: [{ text: `${systemPrompt}

User input fields:
${JSON.stringify(existingData, null, 2)}` }]
          }],
          generationConfig: {
            temperature: 0.1,
            responseMimeType: "application/json"
          }
        };

        async function fetchWithRetry(retries = 2, delayMs = 1500) {
          for (let attempt = 0; attempt <= retries; attempt++) {
            try {
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
              });

              if ((res.status === 503 || res.status === 429) && attempt < retries) {
                await new Promise(r => setTimeout(r, delayMs));
                delayMs *= 1.5;
                continue;
              }

              if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(errData.error?.message || `API 請求失敗 (${res.status})`);
              }

              return await res.json();
            } catch (err) {
              if (attempt >= retries) throw err;
              await new Promise(r => setTimeout(r, delayMs));
            }
          }
        }

        const data = await fetchWithRetry();
        const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!jsonText) throw new Error("AI 未回傳有效結果");

        return JSON.parse(jsonText);
      }
    };

    /**
     * 6. 通用過濾器
     */
    function filterVocabulary(vocabList, selectedCategory, selectedMastery, targetLangCode) {
      return vocabList.filter(word => {
        if (selectedCategory !== 'ALL' && word.category !== selectedCategory) return false;

        if (selectedMastery !== 'ALL') {
          const srs = Storage.getLangSrs(word.id, targetLangCode || 'en');
          const now = new Date();

          if (selectedMastery === 'NEW') {
            if (srs) return false;
          } else if (selectedMastery === 'DUE') {
            if (!srs) return true;
            const isExpired = new Date(srs.nextReviewDate) <= now;
            const isForgotten = (srs.lastQuality !== undefined && srs.lastQuality < 3);
            if (!isExpired && !isForgotten) return false;
          } else if (selectedMastery === 'LEARNING') {
            if (!srs || srs.interval > 6) return false;
          } else if (selectedMastery === 'MASTERED') {
            if (!srs || srs.interval <= 6) return false;
          }
        }

        return true;
      });
    }

    const SpellingView = {

      changeCategory(c) { this.filterCategory = c; this.currentIndex = 0; this.results = {}; router.refresh(); },

      check() {
        const input = document.getElementById('spellingInput');
        if (!input) return;
        const val = input.value.trim();
        const allVocab = Storage.getVocab();
        const filtered = filterVocabulary(allVocab, this.filterCategory, this.filterMastery, this.activeLang);
        const word = filtered[this.currentIndex];
        const correctTarget = (word.targets && word.targets[this.activeLang] || '').trim();

        const lowerVal = val.toLowerCase();
        const lowerTarget = correctTarget.toLowerCase();
        let isCorrect = lowerVal === lowerTarget;
        let guidanceMessage = '';

        if (!isCorrect && Storage.isSmartGuidanceEnabled() && this.activeLang === 'es') {
          if (lowerTarget.startsWith('el ') && lowerVal === lowerTarget.replace('el ', '').trim()) {
            guidanceMessage = '💡 拼寫完全正確！但別忘了加上陽性冠詞【el】喔！';
          } else if (lowerTarget.startsWith('la ') && lowerVal === lowerTarget.replace('la ', '').trim()) {
            guidanceMessage = '💡 拼寫完全正確！但別忘了加上陰性冠詞【la】喔！';
          }
        }

        const updatedSrs = Storage.saveLangSrs(word.id, this.activeLang, isCorrect ? 4 : 1);
        const intervalMsg = isCorrect 
          ? `自動推進記憶：${updatedSrs.interval}天後複習` 
          : '記憶重置：明天複習 (1天)';

        this.results[this.activeLang] = {

        };

    const SentenceTypingView = {

      targetLang: 'ja',
      jaForm: 'polite',
      showHint: false,
      showGrammar: false,
      isChecked: false,
      isCorrect: false,
      userInput: '',
      currentVariantIdx: 0,
      guidanceMessage: '',

      getSentences() {
        return Storage.getSentences();
      },

      getSrsKey(sentenceId) {
        if (this.targetLang === 'ja') {
          return `${sentenceId}_ja_${this.jaForm}`;
        }
        return `${sentenceId}_${this.targetLang}`;
      },

      getActiveSentence(baseSentence) {
        let variants = baseSentence.variants;
        if (typeof variants === 'string') {
          try { variants = JSON.parse(variants); } catch(e) { variants = []; }
        }

        if (!variants || variants.length === 0) {
          return {
            ...baseSentence,
            isDynamic: false,
            activeZh: baseSentence.prompt_zh,
            activeEn: baseSentence.en_target,
            activeJa: (this.jaForm === 'plain' && baseSentence.ja_plain) ? baseSentence.ja_plain : baseSentence.ja_target,
            activeJaRuby: (this.jaForm === 'plain' && baseSentence.ja_plain_ruby) ? baseSentence.ja_plain_ruby : (baseSentence.ja_ruby || baseSentence.ja_target),
            activeEs: baseSentence.es_target
          };
        }

        const v = variants[this.currentVariantIdx % variants.length];
        const replaceSlot = (str, rep) => (str || '').replace(/\{[a-zA-Z0-9_]+\}/g, rep || '');

        const jaWord = (this.jaForm === 'plain' && v.ja_plain) ? v.ja_plain : v.ja;
        const jaBase = (this.jaForm === 'plain' && baseSentence.ja_plain) ? baseSentence.ja_plain : baseSentence.ja_target;
        const jaRubyBase = (this.jaForm === 'plain' && baseSentence.ja_plain_ruby) ? baseSentence.ja_plain_ruby : (baseSentence.ja_ruby || baseSentence.ja_target);

        return {
          ...baseSentence,
          isDynamic: true,
          activeVariant: v,
          activeZh: replaceSlot(baseSentence.prompt_zh, v.zh),
          activeEn: replaceSlot(baseSentence.en_target, v.en),
          activeJa: replaceSlot(jaBase, jaWord),
          activeJaRuby: replaceSlot(jaRubyBase, jaWord),
          activeEs: replaceSlot(baseSentence.es_target, v.es)
        };
      },

      shuffleVariant() {
        const sentences = this.getSentences();
        const base = sentences[this.currentIndex];
        let variants = base.variants;
        if (typeof variants === 'string') {
          try { variants = JSON.parse(variants); } catch(e) { variants = []; }
        }
        if (variants && variants.length > 1) {
          this.currentVariantIdx = (this.currentVariantIdx + 1) % variants.length;
          this.retry();
        }
      },

      retry() {
        this.isChecked = false;
        this.userInput = '';
        this.guidanceMessage = '';
        router.refresh();
      },

      render() {
        const sentences = this.getSentences();
        const activeLangs = Storage.getUserLangs().filter(l => Storage.isLangActive(l.code));

        if (sentences.length === 0) {
          return `

            </div>
          `;
        }

        const rawSentence = sentences[this.currentIndex];
        const sentence = this.getActiveSentence(rawSentence);
        const targetLangMeta = activeLangs.find(l => l.code === this.targetLang) || activeLangs[0];
        const srsKey = this.getSrsKey(rawSentence.id);
        const srsState = Storage.getSrsRecords()[srsKey];

        let correctText = '';
        let rubyText = '';
        if (this.targetLang === 'ja') {
          correctText = sentence.activeJa;
          rubyText = sentence.activeJaRuby;
          if (!Storage.isFuriganaEnabled()) {
            rubyText = rubyText.replace(/<rt>.*?<\/rt>/g, '').replace(/<\/?ruby>/g, '');
          }
        } else if (this.targetLang === 'es') {
          correctText = sentence.activeEs;
          rubyText = sentence.activeEs;
        } else {
          correctText = sentence.activeEn;
          rubyText = sentence.activeEn;
        }

        const langTabs = activeLangs.map(l => `
          <button data-action="sentence-select-lang" data-lang="${Security.escape(l.code)}" 
            class="px-3 py-1 rounded-full text-xs font-medium transition-all ${this.targetLang === l.code ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}">
            ${l.flag} ${Security.escape(l.name)}
          </button>
        `).join('');

        return `
          <div class="flex-1 flex flex-col justify-between space-y-3.5">
            
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                ${langTabs}
              </div>
              <span class="text-xs text-slate-400 font-mono">${this.currentIndex + 1} / ${sentences.length}</span>
            </div>

            ${this.targetLang === 'ja' ? `
              <div class="flex items-center justify-between bg-slate-950/60 p-1.5 rounded-xl border border-slate-800 text-xs">
                <span class="text-[11px] text-slate-400 pl-1">日語語境格式：</span>
                <div class="flex gap-1">
                  <button data-action="sentence-set-ja-form" data-form="polite" 
                    class="px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${this.jaForm === 'polite' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}">
                    🔷 禮貌說法 (丁寧)
                  </button>
                  <button data-action="sentence-set-ja-form" data-form="plain" 
                    class="px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${this.jaForm === 'plain' ? 'bg-amber-600 text-white' : 'text-slate-400 hover:bg-slate-800'}">
                    🔶 朋友說法 (常體)
                  </button>
                </div>
              </div>
            ` : ''}

            <div class="bg-gradient-to-br from-indigo-950/70 to-slate-800 border border-indigo-500/30 rounded-2xl p-4 shadow-lg space-y-2">
              <div class="flex justify-between items-center text-xs text-indigo-300">
                <div class="flex items-center gap-1.5">
                  <span class="font-semibold uppercase tracking-wider">${Security.escape(sentence.category || '會話練習')}</span>
                  ${sentence.isDynamic ? `<span class="bg-amber-950/70 text-amber-300 border border-amber-600/40 text-[10px] px-1.5 py-0.5 rounded-full font-medium">🎲 隨機變體句</span>` : ''}
                </div>
                <div class="flex items-center gap-2">
                  ${sentence.isDynamic ? `
                    <button data-action="sentence-shuffle-variant" class="text-[11px] text-amber-300 hover:text-white underline">
                      🎲 換個變體詞
                    </button>
                  ` : ''}
                  <button data-action="sentence-toggle-hint" class="text-[11px] text-slate-400 hover:text-white underline">
                    ${this.showHint ? '隱藏提示' : '💡 提示'}
                  </button>

              </div>

              <div class="text-xl sm:text-2xl font-bold text-white tracking-wide pt-0.5">
                ${Security.escape(sentence.activeZh)}
              </div>

              <div class="flex items-center gap-2 pt-0.5">
                <button data-action="sentence-toggle-grammar" class="px-2.5 py-1 bg-indigo-900/60 hover:bg-indigo-800 text-indigo-300 border border-indigo-600/40 rounded-lg text-xs font-medium transition-colors">
                  ${this.showGrammar ? '📖 收合文法詳解' : '📖 展開文法詳解'}

      check() {
        const textarea = document.getElementById('sentenceInput');
        if (!textarea) return;
        this.userInput = textarea.value.trim();
        if (!this.userInput) return;

        const rawSentence = this.getSentences()[this.currentIndex];
        const sentence = this.getActiveSentence(rawSentence);

        let correctText = '';
        let altText = '';
        
        if (this.targetLang === 'ja') {
          correctText = sentence.activeJa;
          altText = (this.jaForm === 'polite') ? (sentence.ja_plain || '') : (sentence.ja_target || '');
        } else if (this.targetLang === 'es') {
          correctText = sentence.activeEs;
        } else {
          correctText = sentence.activeEn;
        }

        const clean = str => (str || '').replace(/[^a-zA-Z0-9一-龥぀-ゟ゠-ヿáéíóúÁÉÍÓÚñÑüÜ]/g, "").toLowerCase();

        const cleanUser = clean(this.userInput);
        const cleanCorrect = clean(correctText);
        const cleanAlt = clean(altText);

        let isMatch = (cleanUser === cleanCorrect);
        let guidance = '';

        if (!isMatch && Storage.isSmartGuidanceEnabled()) {
          if (this.targetLang === 'ja' && cleanAlt && cleanUser === cleanAlt) {
            guidance = (this.jaForm === 'polite') 
              ? '💡 意思完全正確！但這是【朋友日常說法 (常體)】，本題目標是【禮貌說法 (ます・です形)】喔！'
              : '💡 意思完全正確！但這是【禮貌說法 (丁寧)】，本題目標是【朋友說法 (常體)】喔！';
          } else if (this.targetLang === 'es') {
            if (cleanCorrect.startsWith('el') && cleanUser === cleanCorrect.slice(2)) {
              guidance = '💡 拼寫很棒！但別忘了加上定冠詞【el】喔！';
            } else if (cleanCorrect.startsWith('la') && cleanUser === cleanCorrect.slice(2)) {
              guidance = '💡 拼寫很棒！但別忘了加上定冠詞【la】喔！';
            }
          }
        }

        this.isChecked = true;
        this.isCorrect = isMatch;
        this.guidanceMessage = guidance;

        const currentQuality = isMatch ? 4 : 1;
        const subLang = this.targetLang + (this.targetLang === 'ja' ? '_' + this.jaForm : '');
        const updatedSentenceSrs = Storage.saveLangSrs(rawSentence.id, subLang, currentQuality);
        this.lastSrsInterval = updatedSentenceSrs.interval;

        if (isMatch) {
          TTS.speak(correctText, this.targetLang);
        }

        router.updateStats();
        router.refresh();
      },

      prev() {
        const sentences = this.getSentences();
        this.currentIndex = (this.currentIndex - 1 + sentences.length) % sentences.length;
        this.currentVariantIdx = Math.floor(Math.random() * 5);
        this.retry();
      },

      next() {
        const sentences = this.getSentences();
        this.currentIndex = (this.currentIndex + 1) % sentences.length;
        this.currentVariantIdx = Math.floor(Math.random() * 5);
        this.retry();
      }
    };

        if (aiResult.baseWord) {
          const b = document.getElementById('input_baseWord');
          if (b && !b.value.trim()) b.value = aiResult.baseWord;
        }
        if (aiResult.meaningZh) {
          const z = document.getElementById('input_meaningZh');
          if (z && !z.value.trim()) z.value = aiResult.meaningZh;
        }
        if (aiResult.pos) {
          const p = document.getElementById('input_pos');
          if (p && !p.value.trim()) p.value = aiResult.pos;
        }
        if (aiResult.category) {
          const selectCat = document.getElementById('select_category');

            selectCat.innerHTML = `

            `;
          }
        }
        if (aiResult.targets) {
          Storage.getUserLangs().forEach(lang => {
            const data = aiResult.targets[lang.code];
            const tElem = document.getElementById(`target_${lang.code}`);
            const pElem = document.getElementById(`phonetic_${lang.code}`);
            if (tElem && !tElem.value.trim() && data?.translation) tElem.value = data.translation;
            if (pElem && !pElem.value.trim() && data?.phonetic) pElem.value = data.phonetic;
          });
        }

        if (v.baseWord || v.meaningZh) return true;
        return Object.values(v.targets).some(val => !!val);

        if (!v.baseWord || !v.meaningZh || !v.pos) return true;
        for (let lang of Storage.getUserLangs()) {
          if (!v.targets[lang.code] || !v.phonetics[lang.code]) return true;

        return false;

        let formValues = this.getFormValues();
        if (!this.hasAtLeastOneInput(formValues)) return alert('請至少在任一欄位輸入一個單字！');

        this.isProcessing = true;

        if (Storage.isAiEnabled() && this.hasEmptyFields(formValues)) {
          this.statusMessage = '🤖 正在透過 AI 自動補齊缺漏語言...';
          router.refresh();
          try {
            const aiResult = await AIHelper.fillMissingFields(formValues);
            this.applyAiResult(aiResult);
            this.lastAiResult = aiResult;
            formValues = this.getFormValues();
          } catch (err) {
            if (!confirm(`自動補齊未執行（${err.message}）。是否仍要以現有輸入內容儲存？`)) {
              this.isProcessing = false;
              this.statusMessage = '';
              router.refresh();
              return;
            }
          }
        }

        let finalCategory = formValues.category;
        if (finalCategory === '__NEW__') {
          finalCategory = prompt('請輸入新分類名稱：') || '通用';
          Storage.addCategory(finalCategory);
        } else if (finalCategory === '__AUTO__') {
          finalCategory = '通用';
        }

        const isTest = Storage.isTestMode();
        const rubyMap = {};
        if (this.lastAiResult?.targets) {
          for (let code in this.lastAiResult.targets) {
            if (this.lastAiResult.targets[code]?.ruby) rubyMap[code] = this.lastAiResult.targets[code].ruby;
          }
        }

        const newWord = {
          id: (isTest ? 'test_' : 'w_') + Date.now(),
          category: (isTest ? '[測試] ' : '') + finalCategory,
          pos: formValues.pos || '詞彙',
          baseWord: formValues.baseWord || formValues.meaningZh || 'Untranslated',
          meaningZh: formValues.meaningZh || '',
          targets: formValues.targets,
          ruby: rubyMap,
          phonetics: formValues.phonetics
        };

        Storage.addWord(newWord);

        const gasUrl = Storage.getGasUrl();
        if (gasUrl) {
          this.statusMessage = '☁️ 正在寫入 Google 試算表...';
          router.refresh();
          try {
            await fetch(gasUrl, {
              method: 'POST',
              body: JSON.stringify({ action: 'appendRow', word: newWord, token: Storage.getGasToken() })
            });
            alert('🎉 成功！單字已同時存入本地與 Google 試算表。');
          } catch (err) {
            alert('已存入本地，但寫入 Google 試算表失敗，請確認網路與 Token。');
          }
        } else {
          alert('單字已儲存於本地！');
        }

        this.isProcessing = false;
        this.statusMessage = '';
        router.updateStats();
        router.navigate('flashcard');
      }

      addNewLang() {
        const select = document.getElementById('newLangSelect');
        if (!select) return;
        const code = select.value;
        const preset = PRESET_LANGUAGES.find(p => p.code === code);
        if (preset) {
          Storage.addUserLang(preset);
          alert(`已成功加入 ${preset.name}！您可以點擊「批次補齊」自動更新題庫。`);
          router.refresh();
        }
      },

      async batchFillMissing() {
        const vocab = Storage.getVocab();
        const userLangs = Storage.getUserLangs();
        const missingWords = vocab.filter(w => userLangs.some(l => !w.targets || !w.targets[l.code]));

        if (missingWords.length === 0) return alert('目前所有單字皆已完整包含所有啟用的語言！');
        if (!confirm(`共有 ${missingWords.length} 筆單字缺少新語言翻譯，是否開始批次補齊？`)) return;

        this.isBatchFilling = true;
        router.refresh();

        let updatedCount = 0;
        try {
          for (let word of missingWords) {
            const aiResult = await AIHelper.fillMissingFields({
              baseWord: word.baseWord,
              meaningZh: word.meaningZh,
              category: word.category,
              pos: word.pos,
              targets: word.targets || {}
            }, userLangs);

            word.targets = word.targets || {};
            word.phonetics = word.phonetics || {};
            word.ruby = word.ruby || {};
            if (!word.pos && aiResult.pos) word.pos = aiResult.pos;

            userLangs.forEach(l => {
              if (!word.targets[l.code] && aiResult.targets?.[l.code]?.translation) {
                word.targets[l.code] = aiResult.targets[l.code].translation;
                word.phonetics[l.code] = aiResult.targets[l.code].phonetic || '';
                if (aiResult.targets[l.code].ruby) word.ruby[l.code] = aiResult.targets[l.code].ruby;
              }
            });
            updatedCount++;
          }

          Storage.setVocab(vocab);
          alert(`批次補齊完成！成功為 ${updatedCount} 筆單字補全多語翻譯。`);
        } catch (err) {
          alert(`補齊過程中斷 (${err.message})，已成功完成 ${updatedCount} 筆。`);
        } finally {
          this.isBatchFilling = false;
          router.refresh();
        }
      },

      saveGeminiKey() {
        const val = document.getElementById('geminiKeyInput')?.value;
        Storage.setGeminiKey(val || '');
        alert('Gemini API Key 已安全儲存！');
      },

      saveGasUrl() {
        const val = document.getElementById('gasUrlInput')?.value;
        Storage.setGasUrl(val || '');
        alert('Google Apps Script 網址已儲存！');
      },

      saveGasToken() {
        const val = document.getElementById('gasTokenInput')?.value;
        Storage.setGasToken(val || '');
        alert('安全權杖 (Secret Token) 已儲存！');
      },

      async uploadSrsNow() {
        const url = Storage.getGasUrl();
        if (!url) return alert('請先儲存 Google Apps Script 網址！');
        this.isSyncingSrs = true;
        router.refresh();

        try {
          await fetch(url, {
            method: 'POST',
            body: JSON.stringify({ action: 'syncSrs', srsRecords: Storage.getSrsRecords(), token: Storage.getGasToken() })
          });
          alert('熟練度進度已成功同步至 Google 試算表「SRS_Progress」分頁！');
        } catch(e) {
          alert('同步失敗，請確認網路連線或 Token 設定。');
        } finally {
          this.isSyncingSrs = false;
          router.refresh();
        }
      },

      async pullFromSheet() {
        const url = Storage.getGasUrl();
        if (!url) return alert('請先填入並儲存 Google Apps Script 網址！');

        this.isPulling = true;
        router.refresh();

        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const sheetWords = await res.json();

          if (!Array.isArray(sheetWords) || sheetWords.length === 0) throw new Error('試算表中未發現有效單字');

          Storage.setVocab(sheetWords);
          alert(`同步成功！已成功自試算表拉取 ${sheetWords.length} 筆單字。`);
        } catch (err) {
          alert(`拉取失敗: ${err.message}\n請確認 Apps Script 權限設為「所有人 (Anyone)」。`);
        } finally {
          this.isPulling = false;
          router.updateStats();
          router.refresh();
        }
      },

      exportBackup() {
        const payload = {
          vocab: Storage.getVocab(),
          srs: Storage.getSrsRecords(),
          date: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `polyglot_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
      },

      async resetSrsOnly() {
        if (!confirm('確定要將所有單字與句型的「熟練度天數」歸零重置嗎？\n（您現有的單字與句型將完整保留）')) return;
        localStorage.removeItem(Storage.KEY_SRS);
        Storage.srsPendingCount = 0;

        const gasUrl = Storage.getGasUrl();
        if (gasUrl) {
          try {
            await fetch(gasUrl, {
              method: 'POST',
              body: JSON.stringify({ action: 'syncSrs', srsRecords: {}, token: Storage.getGasToken() })
            });
          } catch(e) {}
        }

        alert('✅ 已成功將所有熟練度進度歸零！試算表上的 SRS_Progress 也已同步清空。');
        router.updateStats();
        router.refresh();
      },

      clearLocalCache() {
        if (!confirm('確定要清除本學習應用的所有本地暫存檔嗎？\n\n包含：本機暫存單字、進度、API Key 與設定。\n（此操作只針對本應用，絕對不會影響電腦其他檔案或其他網站）')) return;
        localStorage.clear();
        sessionStorage.clear();
        alert('✅ 已成功清除本應用所有本地暫存檔！即將自動重新整理還原初始狀態。');
        window.location.reload();
      },

      resetToSeed() {
        if (!confirm('確定要還原成預設題庫嗎？這將覆蓋本地自訂項目。')) return;
        Storage.setVocab(INITIAL_VOCABULARY);
        localStorage.removeItem(Storage.KEY_SRS);
        alert('✅ 已還原為預設題庫！');
        router.updateStats();
        router.refresh();
      }
    };

    /**
     * 8. 路由管理器
     */
    const router = {
      currentView: 'flashcard',
      views: {
        flashcard: FlashcardView,
        spelling: SpellingView,
        sentence: SentenceTypingView,
        addWord: AddWordView,
        settings: SettingsView
      },

      navigate(name) {
        if (!this.views[name]) return;
        this.currentView = name;

        ['flashcard', 'spelling', 'sentence', 'addWord', 'settings'].forEach(v => {
          const btn = document.getElementById(`nav-${v}`);
          if (btn) {
            btn.className = (v === name) 
              ? 'flex-1 min-w-[70px] py-2 rounded-lg text-center transition-all bg-indigo-600 text-white font-semibold'
              : 'flex-1 min-w-[70px] py-2 rounded-lg text-center transition-all text-slate-400 hover:bg-slate-800';
          }
        });

        this.refresh();
      },

      refresh() {
        Storage.updateTestBanner();
        const container = document.getElementById('viewContainer');
        const view = this.views[this.currentView];
        if (container && view) container.innerHTML = view.render();
      },

      updateStats() {
        const vocab = Storage.getVocab();
        const records = Storage.getSrsRecords();
        const badge = document.getElementById('statsBadge');
        if (badge) {
          badge.textContent = `📚 詞庫: ${vocab.length} | 🎯 進度點: ${Object.keys(records).length}`;
        }
      },

      init() {
        this.updateStats();
        Storage.updateTestBanner();
        this.navigate('flashcard');
      }
    };

    /**
     * =========================================================================
     * 9. 全域宣告式事件委派核心 (Event Delegation Hub)
     * 徹底拔除所有 HTML 中的 inline 事件，符合嚴格 CSP 規範
     * =========================================================================
     */
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;

      switch(action) {
        case 'navigate':
          router.navigate(btn.dataset.target);
          break;
        case 'clear-test-data':
          Storage.clearTestModeData();
          break;
        case 'speak':
          TTS.speak(btn.dataset.text, btn.dataset.lang);
          break;

        // 字卡動作
        case 'toggle-es-gender':
          Storage.setEsGenderEnabled(!Storage.isEsGenderEnabled());
          router.refresh();
          break;
        case 'toggle-furigana':
          Storage.setFuriganaEnabled(!Storage.isFuriganaEnabled());
          router.refresh();
          break;

          break;

          break;

          break;
        case 'flashcard-rate':
          FlashcardView.rate(btn.dataset.lang, parseInt(btn.dataset.quality, 10));
          break;
        case 'flashcard-prev':
          FlashcardView.prev(parseInt(btn.dataset.len, 10));
          break;
        case 'flashcard-next':
          FlashcardView.next(parseInt(btn.dataset.len, 10));
          break;
        case 'flashcard-reset-filter':
          FlashcardView.resetFilter();
          break;

          break;
        case 'spelling-select-lang':
          SpellingView.selectLang(btn.dataset.lang);
          break;
        case 'spelling-toggle-hint':
          SpellingView.toggleHint();
          break;
        case 'spelling-check':
          SpellingView.check();
          break;
        case 'spelling-prev':
          SpellingView.prev(parseInt(btn.dataset.len, 10));
          break;
        case 'spelling-next':
          SpellingView.next(parseInt(btn.dataset.len, 10));
          break;
        case 'spelling-reset-filter':

          break;

          SentenceTypingView.changeLang(btn.dataset.lang);
          break;
        case 'sentence-set-ja-form':
          SentenceTypingView.setJaForm(btn.dataset.form);

          break;
        case 'sentence-retry':

          break;
        case 'sentence-prev':

          break;
        case 'sentence-next':

          break;

          router.refresh();
          break;

          break;

          SettingsView.saveGeminiKey();
          break;

          break;

    document.addEventListener('change', (e) => {
      const el = e.target.closest('[data-change]');
      if (!el) return;
      const change = el.dataset.change;

      switch(change) {
        case 'flashcard-category':
          FlashcardView.changeCategory(el.value);
          break;
        case 'flashcard-mastery':
          FlashcardView.changeMastery(el.value);
          break;
        case 'spelling-category':
          SpellingView.changeCategory(el.value);
          break;
        case 'spelling-mastery':
          SpellingView.changeMastery(el.value);
          break;
        case 'toggle-smart-guidance':
          Storage.setSmartGuidanceEnabled(el.checked);
          router.refresh();
          break;
        case 'toggle-ai-autofill':
          Storage.setAiEnabled(el.checked);
          router.refresh();
          break;
        case 'toggle-furigana-setting':
          Storage.setFuriganaEnabled(el.checked);
          break;
        case 'toggle-es-gender-setting':
          Storage.setEsGenderEnabled(el.checked);
          break;
        case 'toggle-lang-active':
          Storage.toggleLangActive(el.dataset.lang);
          router.refresh();
          break;
        case 'settings-volume':
          Storage.setVolume(el.dataset.lang, el.value);
          const lbl = document.getElementById(`vol-label-${el.dataset.lang}`);
          if (lbl) lbl.textContent = `${Math.round(el.value * 100)}%`;
          break;
        case 'toggle-test-mode-setting':
          Storage.setTestMode(el.checked);
          router.refresh();
          break;
        case 'change-key-mode':
          Storage.setKeyStorageMode(el.value);
          router.refresh();
          break;
      }
    });

    // 啟動入口
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => router.init());
    } else {
      router.init();
    }
  </script>
</body>
</html>
